<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HIT FOR HIT BATTLES — STV Radiomeltdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#050914;
    --navy-900:#0a1128;
    --navy-800:#101a3a;
    --gold:#c9a24b;
    --gold-bright:#f0d586;
    --text-primary:#f5f3ec;
    --text-muted:#8b93b8;
    --live-red:#e14b4b;
  }
  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }
  html,
  body{
    width:100%;
    height:100%;
    background:var(--navy-950);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  .channel{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(
        ellipse at top,
        rgba(24,36,80,0.55),
        transparent 60%
      ),
      var(--navy-950);
  }
  /* ---------- HEADER ---------- */
  header{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid rgba(201,162,75,0.18);
    background:linear-gradient(
      180deg,
      rgba(10,17,40,0.95),
      rgba(10,17,40,0.75)
    );
    z-index:5;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.5px;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(240,213,134,.35);
  }
  .brand .sub{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-muted);
    text-transform:uppercase;
    border-left:1px solid rgba(139,147,184,.4);
    padding-left:10px;
  }
  .status-cluster{
    display:flex;
    align-items:center;
    gap:18px;
    font-family:'Oswald',sans-serif;
  }
  .on-air{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    letter-spacing:1.5px;
    color:var(--live-red);
    font-weight:600;
  }
  .on-air .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--live-red);
    box-shadow:0 0 10px var(--live-red);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{
      opacity:1;
      transform:scale(1);
    }
    50%{
      opacity:.4;
      transform:scale(.75);
    }
  }
  .clock{
    font-size:14px;
    letter-spacing:1px;
    color:var(--text-primary);
    min-width:78px;
    text-align:right;
  }
  /* ---------- MAIN PLAYER ---------- */
  .stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
  }
  .youtube-wrap{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
  }
  .youtube-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  /* ---------- TITLE OVERLAY ---------- */
  .show-title{
    position:absolute;
    top:22px;
    left:22px;
    z-index:10;
    pointer-events:none;
  }
  .show-title .series{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:4px;
  }
  .show-title .title{
    font-family:'Oswald',sans-serif;
    font-size:clamp(24px,4vw,44px);
    line-height:1;
    font-weight:700;
    letter-spacing:1px;
    color:var(--text-primary);
    text-shadow:
      0 2px 10px rgba(0,0,0,.9),
      0 0 20px rgba(0,0,0,.8);
  }
  /* ---------- STV BUG ---------- */
  .bug{
    position:absolute;
    bottom:18px;
    right:18px;
    z-index:10;
    pointer-events:none;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1.5px;
    color:rgba(245,243,236,.65);
    background:rgba(5,9,20,.45);
    padding:5px 10px;
    border:1px solid rgba(201,162,75,.35);
    border-radius:2px;
  }
  /* ---------- FOOTER ---------- */
  .footer{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9px 20px;
    background:linear-gradient(
      0deg,
      rgba(10,17,40,.98),
      rgba(10,17,40,.85)
    );
    border-top:1px solid rgba(201,162,75,.18);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .footer span{
    color:var(--gold);
  }
  /* ---------- MOBILE ---------- */
  @media (max-width:700px){
    header{
      padding:11px 14px;
    }
    .brand .mark{
      font-size:17px;
    }
    .brand .sub{
      font-size:9px;
      letter-spacing:1.5px;
    }
    .clock{
      display:none;
    }
    .status-cluster{
      gap:0;
    }
    .show-title{
      top:14px;
      left:14px;
    }
    .show-title .title{
      font-size:28px;
    }
    .bug{
      bottom:12px;
      right:12px;
    }
    .footer{
      font-size:9px;
      padding:8px 10px;
    }
  }
</style>
</head>
<body>
<div class="channel">
  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="mark">STV</div>
      <div class="sub">Radiomeltdown</div>
    </div>
    <div class="status-cluster">
      <div class="on-air">
        <span class="dot"></span>
        ON AIR
      </div>
      <div class="clock" id="clock">
        --:--:--
      </div>
    </div>
  </header>
  <!-- BIG YOUTUBE PLAYER -->
  <main class="stage">
    <div class="youtube-wrap">
      <iframe
        src="https://www.youtube.com/embed/videoseries?list=PLa9auhfp7FjQ&autoplay=1&rel=0"
        title="HIT FOR HIT BATTLES"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <!-- TITLE -->
    <div class="show-title">
      <div class="series">
        STV RADIOMELTDOWN
      </div>
      <div class="title">
        HIT FOR HIT BATTLES
      </div>
    </div>
    <!-- STV BUG -->
    <div class="bug">
      STV
    </div>
  </main>
  <!-- FOOTER -->
  <div class="footer">
    <span>HIT FOR HIT BATTLES</span>
    &nbsp; • &nbsp;
    STV RADIOMELTDOWN
  </div>
</div>
<script>
  // ---------- CLOCK ----------
  function pad(n){
    return n.toString().padStart(2,'0');
  }
  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  updateClock();
  setInterval(updateClock,1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dispatch — Alexander Lead Training</title>
<style>
  :root{
    --bg: #141A22;
    --bg-grain: #10151C;
    --surface: #202836;
    --surface-2: #29323F;
    --line: #37414F;
    --amber: #F0A93A;
    --amber-dim: #8A6524;
    --teal: #4C9A93;
    --red: #C1473B;
    --green: #6FA36B;
    --text: #EDE8DE;
    --text-dim: #9AA3B0;
    --text-faint: #6B7684;
    --font-display: 'Oswald-fallback', 'Arial Narrow', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --radius: 14px;
  }
  @font-face{
    font-family:'Oswald-fallback';
    src: local('Oswald'), local('Arial Narrow Bold');
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(240,169,58,0.06), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:28px;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px 12px;
    position:sticky;
    top:0;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    z-index:20;
  }
  .topbar .back{
    width:38px;height:38px;border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;cursor:pointer;flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .topbar .back:active{background:var(--surface-2);}
  .topbar .titles{flex:1;min-width:0;}
  .topbar .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber);margin:0 0 2px;
  }
  .topbar h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    letter-spacing:.01em;
    margin:0;
    text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .channel-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    flex-shrink:0;
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  main{flex:1;padding:4px 18px 18px;}

  /* ---------- Dashboard ---------- */
  .hero-card{
    background:linear-gradient(155deg, var(--surface) 0%, #1A212C 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;
    background:radial-gradient(circle, rgba(240,169,58,.14), transparent 70%);
  }
  .hero-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);}
  .hero-name{font-family:var(--font-display);font-size:26px;text-transform:uppercase;font-weight:700;margin:4px 0 10px;}
  .hero-stats{display:flex;gap:18px;font-family:var(--font-mono);}
  .hero-stat b{display:block;font-size:19px;color:var(--amber);font-weight:700;}
  .hero-stat span{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 14px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
    display:flex;flex-direction:column;gap:8px;
    min-height:104px;
    transition:transform .1s ease, border-color .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .tile:active{transform:scale(.97);border-color:var(--amber-dim);}
  .tile .icon{font-size:26px;line-height:1;}
  .tile .label{font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:.01em;font-weight:600;}
  .tile .sub{font-size:11.5px;color:var(--text-dim);line-height:1.3;}
  .tile.wide{grid-column:1/3;flex-direction:row;align-items:center;min-height:auto;padding:16px;}
  .tile.wide .icon{font-size:24px;}
  .tile.primary{border-color:var(--amber-dim);background:linear-gradient(155deg,#2B2013,var(--surface));}

  /* ---------- Section basics ---------- */
  .section-title{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);margin:22px 0 10px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
  }
  .btn{
    display:block;width:100%;
    background:var(--amber);color:#20140A;
    font-family:var(--font-display);font-size:15px;text-transform:uppercase;font-weight:700;letter-spacing:.02em;
    border:none;border-radius:12px;padding:15px 16px;
    cursor:pointer;text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{filter:brightness(.92);}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn[disabled]{opacity:.4;pointer-events:none;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  /* ---------- Call console ---------- */
  .console{
    background:radial-gradient(circle at 50% 0%, #232C3A, #171E28 70%);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
  }
  .console-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .console-head .who{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  .console-head .who b{color:var(--text);font-weight:600;}
  .signal{display:flex;gap:3px;align-items:flex-end;height:14px;}
  .signal i{width:4px;background:var(--line);border-radius:1px;display:block;}
  .signal i:nth-child(1){height:5px;} .signal i:nth-child(2){height:8px;}
  .signal i:nth-child(3){height:11px;} .signal i:nth-child(4){height:14px;}
  .signal.good i{background:var(--green);}
  .signal.warn i{background:var(--amber);}
  .signal.bad i{background:var(--red);}

  .meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:12px;}
  .meter-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));transition:width .35s ease;}

  .transcript{display:flex;flex-direction:column;gap:10px;max-height:none;}
  .bubble{
    max-width:88%;
    padding:11px 13px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.42;
  }
  .bubble.homeowner{
    align-self:flex-start;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .bubble.braylen{
    align-self:flex-end;
    background:linear-gradient(155deg,#3A2C15,#2B2013);
    border:1px solid var(--amber-dim);
    border-bottom-right-radius:3px;
    color:#F5E3C4;
  }
  .bubble .tag{display:block;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-bottom:3px;}
  .bubble.verdict{
    align-self:center;max-width:96%;text-align:center;
    font-family:var(--font-mono);font-size:12px;
    border-radius:10px;padding:9px 12px;
  }
  .bubble.verdict.good{background:rgba(111,163,107,.14);border:1px solid var(--green);color:#BFE0BC;}
  .bubble.verdict.ok{background:rgba(240,169,58,.12);border:1px solid var(--amber-dim);color:#F0D8A8;}
  .bubble.verdict.bad{background:rgba(193,71,59,.14);border:1px solid var(--red);color:#F0B9B4;}

  .choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .choice{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-align:left;color:var(--text);font-size:14px;line-height:1.4;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .choice:active{background:var(--surface-2);}
  .choice .qmark{font-family:var(--font-mono);color:var(--text-faint);font-size:11px;margin-right:6px;}

  /* ---------- Badges / classification ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    padding:5px 10px;border-radius:20px;border:1px solid var(--line);
  }
  .badge.hot{color:#FFD7A0;border-color:var(--amber);background:rgba(240,169,58,.1);}
  .badge.warm{color:#F0D8A8;border-color:var(--amber-dim);background:rgba(240,169,58,.06);}
  .badge.service{color:#B7E1DC;border-color:var(--teal);background:rgba(76,154,147,.1);}
  .badge.cold{color:var(--text-dim);border-color:var(--line);background:var(--surface-2);}
  .badge.dnc{color:#F5B7B0;border-color:var(--red);background:rgba(193,71,59,.12);}

  /* ---------- forms ---------- */
  label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=tel],textarea,select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px 12px;color:var(--text);font-size:15px;font-family:var(--font-body);
  }
  textarea{resize:vertical;min-height:64px;}
  .toggle-row{display:flex;gap:8px;flex-wrap:wrap;}
  .toggle{
    flex:1;min-width:80px;text-align:center;padding:11px 8px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;
  }
  .toggle.on{background:var(--amber);color:#20140A;border-color:var(--amber);font-weight:700;}

  .qa-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .qa-row .q{font-size:13.5px;margin-bottom:8px;}

  p.copy{font-size:14px;line-height:1.55;color:var(--text-dim);margin:0 0 10px;}
  ul.indicator-list{margin:0 0 4px;padding-left:18px;}
  ul.indicator-list li{font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  .warn-box{
    background:rgba(240,169,58,.08);border:1px solid var(--amber-dim);border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#F0D8A8;line-height:1.5;margin-top:14px;
  }
  .score-big{
    font-family:var(--font-display);font-size:56px;font-weight:700;text-align:center;
    color:var(--amber);line-height:1;margin:6px 0 2px;
  }
  .score-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .score-row:last-child{border-bottom:none;}
  .score-row .v{font-family:var(--font-mono);}
  .v.good{color:var(--green);} .v.ok{color:var(--amber);} .v.bad{color:var(--red);}
  .empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:30px 10px;}
  .progress-bar-outer{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .progress-bar-inner{height:100%;background:var(--amber);}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .history-row:last-child{border-bottom:none;}
  .history-row .meta{color:var(--text-faint);font-family:var(--font-mono);font-size:11px;}
  a.plain{color:var(--teal);}
  .propwire-link{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;color:var(--text);text-decoration:none;
  }
  .propwire-link b{font-family:var(--font-display);text-transform:uppercase;font-size:14px;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--amber-dim);color:var(--text);
    padding:10px 18px;border-radius:30px;font-size:13px;z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .sync-pill{
    position:fixed;top:12px;right:12px;z-index:99;
    font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .sync-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .sync-pill.ok .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
  .sync-pill.err .dot{background:var(--red);}
  .sync-pill .logout{
    margin-left:2px;border:none;background:none;color:var(--text-dim);cursor:pointer;
    font-family:var(--font-mono);text-transform:uppercase;font-size:10px;letter-spacing:.06em;
    padding:0;text-decoration:underline;
  }
  .auth-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .auth-card{
    width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:26px 22px;
  }
  .auth-error{
    background:rgba(193,71,59,.12);border:1px solid var(--red);color:#F0B9B4;
    border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:12px;
  }
  /* ---------- Tutorial / how-to-use ---------- */
  .tour-step{display:flex;gap:14px;margin-bottom:4px;}
  .tour-num{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--surface-2);
    border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--font-mono);font-weight:700;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .tour-body{flex:1;padding-bottom:18px;border-left:1px solid var(--line);margin-left:15px;padding-left:19px;margin-top:-2px;}
  .tour-step:last-child .tour-body{border-left:1px solid transparent;padding-bottom:0;}
  .tour-title{font-family:var(--font-display);text-transform:uppercase;font-size:14px;letter-spacing:.01em;margin-bottom:4px;}
  .video-frame{
    width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:#000;margin-bottom:14px;
  }
  .video-frame video, .video-frame iframe{width:100%;height:100%;display:block;border:none;}
  .video-placeholder{
    width:100%;aspect-ratio:16/9;border-radius:12px;border:1px dashed var(--line);
    background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;margin-bottom:14px;color:var(--text-dim);text-align:center;padding:16px;
  }
  .video-placeholder .icon{font-size:28px;}

  /* ---------- Training Library ---------- */
  .lib-frame{
    width:100%;min-height:70vh;border:1px solid var(--line);border-radius:12px;
    background:#fff;display:block;
  }
  select optgroup{
    background:var(--surface);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  }
  select option{background:var(--bg);color:var(--text);font-family:var(--font-body);}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase (compat SDK — works with plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
/* =========================================================================
   GITHUB TRAINING LIBRARY SETTINGS
   ================================
   These three values control where the "Training Library" tile looks for
   files. This is the ONLY place you should need to edit to point the
   library at a different repo or folder.

   GITHUB_OWNER  = the GitHub username or organization that owns the repo
                   (e.g. "jsmith").
   GITHUB_REPO   = the name of the repository itself (e.g. "sales-training").
   GITHUB_FOLDER = the folder/path inside that repo to scan for training
                   files. Subfolders inside this folder are scanned too, and
                   shown as categories in the dropdown.

   Requirements:
   - The repository (and this folder) must be PUBLIC. No GitHub token is
     used or required — this only calls GitHub's public read-only
     Contents API.
   - Only .html, .htm, and .pdf files are picked up. Everything else
     (images, .css, .js, .git files, etc.) is ignored automatically.
   - If a file named "index.html" exists directly inside GITHUB_FOLDER, it
     is treated as the default module and loads automatically.
   ========================================================================= */
const GITHUB_OWNER = "YOUR_GITHUB_USERNAME";
const GITHUB_REPO = "YOUR_REPO_NAME";
const GITHUB_FOLDER = "RealEstate";

/* =========================================================================
   FIREBASE SETUP
   Swap the values below if you ever need to point this app at a different
   Firebase project. Firestore is used for two things:
     - a single "progress" doc (call count, avg score, recent history)
     - a "leads" collection (one document per captured lead)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCNdyRTEynhQTm4BqspOxpOaC8twHeod6w",
  authDomain: "h4h-walkie.firebaseapp.com",
  databaseURL: "https://h4h-walkie-default-rtdb.firebaseio.com",
  projectId: "h4h-walkie",
  storageBucket: "h4h-walkie.firebasestorage.app",
  messagingSenderId: "253773392789",
  appId: "1:253773392789:web:27b1141ffa1f1b7815a49c",
  measurementId: "G-HHNFJF23JW"
};

let db = null;
let auth = null;
let fbReady = false;
let currentUser = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = true;
}catch(e){
  console.error('Firebase init failed', e);
}

const PROGRESS_DOC = db ? db.collection('dispatch').doc('progress') : null;
const LEADS_COL = db ? db.collection('dispatch_leads') : null;

/* ---------------- AUTH ---------------- */
let authError = '';
async function handleAuthSubmit(mode){
  authError = '';
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value;
  if(!email || !pass){ authError = 'Enter an email and password.'; renderAuthScreen(); return; }
  const btn = document.getElementById('auth_submit_btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{
    if(mode === 'signup'){
      await auth.createUserWithEmailAndPassword(email, pass);
    }else{
      await auth.signInWithEmailAndPassword(email, pass);
    }
    // onAuthStateChanged handles the rest
  }catch(e){
    authError = e.message || 'Something went wrong. Try again.';
    renderAuthScreen();
  }
}
async function handleSignOut(){
  try{ await auth.signOut(); }catch(e){ console.error('sign out failed', e); }
}
function renderAuthScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <p class="hero-label" style="text-align:center">Saneca Field Training</p>
        <h1 style="font-family:var(--font-display);text-transform:uppercase;text-align:center;font-size:24px;margin:6px 0 18px;">Dispatch Console</h1>
        <label>Email</label>
        <input type="text" id="auth_email" placeholder="you@example.com" autocomplete="username">
        <label>Password</label>
        <input type="text" id="auth_pass" placeholder="••••••••" autocomplete="current-password" style="-webkit-text-security:disc;text-security:disc;">
        ${authError ? `<div class="auth-error">${authError}</div>` : ''}
        <button class="btn" id="auth_submit_btn" style="margin-top:16px" onclick="handleAuthSubmit('signin')">Sign In</button>
        <button class="btn secondary" style="margin-top:10px" onclick="handleAuthSubmit('signup')">Create Account</button>
        <p class="copy" style="text-align:center;margin-top:14px;font-size:12px;">New team members: use Create Account once, then Sign In after that.</p>
      </div>
    </div>
  `;
}

function setSyncStatus(status){
  const el = document.getElementById('syncPill');
  if(!el) return;
  el.className = 'sync-pill ' + status;
  el.querySelector('.label').textContent = status==='ok' ? 'Synced' : status==='err' ? 'Offline' : 'Syncing…';
}

/* =========================================================================
   EDITABLE TRAINING DATA
   Everything below this line and above "ENGINE" can be extended without
   touching the app logic: add objections, responses, scenarios, services,
   or whole new pushback library entries just by editing these arrays/objects.

/* =========================================================================
   TRAINING LIBRARY — GitHub-powered auto-loading module list.
   Reads GITHUB_OWNER / GITHUB_REPO / GITHUB_FOLDER (defined at the very top
   of this script) and turns whatever .html/.htm/.pdf files it finds inside
   that folder (including subfolders) into a browsable, tappable library.
   No filenames are hard-coded anywhere below — everything is discovered
   live from the GitHub Contents API.
   ========================================================================= */

// Turns "asking-for-price.html" into "Asking For Price".
function humanizeFilename(filename){
  let name = filename.replace(/\.(html?|pdf)$/i, '');
  name = name.replace(/[-_]+/g, ' ').trim().replace(/\s+/g, ' ');
  if(!name) return filename;
  return name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

// One call to GitHub's public Contents API for a single folder level.
async function fetchGithubContents(path){
  const encodedPath = path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${encodedPath}`;
  const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
  if(!res.ok){
    if(res.status === 404) throw new Error('NOT_FOUND');
    if(res.status === 403) throw new Error('RATE_LIMIT');
    throw new Error('API_ERROR');
  }
  const data = await res.json();
  if(!Array.isArray(data)) throw new Error('NOT_A_FOLDER');
  return data;
}

// Recursively walks a folder, collecting .html/.htm/.pdf files and
// descending into subfolders (which become categories in the dropdown).
async function scanGithubFolder(path, categoryLabel){
  const items = await fetchGithubContents(path);
  const files = [];
  const subCategories = [];
  for(const item of items){
    if(item.type === 'file'){
      const match = item.name.match(/\.(html?|pdf)$/i);
      if(!match) continue; // ignore images, .css, .js, .git files, etc.
      const ext = match[1].toLowerCase() === 'pdf' ? 'pdf' : 'html';
      files.push({
        name: item.name,
        path: item.path,
        ext: ext,
        downloadUrl: item.download_url,
        title: humanizeFilename(item.name),
        isIndex: /^index\.html?$/i.test(item.name)
      });
    } else if(item.type === 'dir'){
      const sub = await scanGithubFolder(item.path, item.name);
      subCategories.push(sub);
    }
  }
  files.sort((a,b) => a.title.localeCompare(b.title));
  return { category: categoryLabel, files: files, subCategories: subCategories };
}

// Flattens the folder tree into a single array of file objects.
function collectLibraryFiles(node){
  let files = node.files ? [...node.files] : [];
  if(node.subCategories){
    node.subCategories.forEach(sc => { files = files.concat(collectLibraryFiles(sc)); });
  }
  return files;
}

// Flattens the folder tree into dropdown/list groups, one per category path.
function flattenLibraryGroups(node, prefix){
  let groups = [];
  if(node.files && node.files.length){
    groups.push({ label: prefix || 'General', files: node.files });
  }
  if(node.subCategories){
    node.subCategories.forEach(sc => {
      const label = prefix ? `${prefix} / ${sc.category}` : sc.category;
      groups = groups.concat(flattenLibraryGroups(sc, label));
    });
  }
  return groups;
}

function libraryErrorMessage(err){
  const msg = (err && err.message) || '';
  if(msg === 'NOT_FOUND') return `The folder "${GITHUB_FOLDER}" or repository "${GITHUB_OWNER}/${GITHUB_REPO}" could not be found. Check your GitHub repository settings.`;
  if(msg === 'RATE_LIMIT') return 'GitHub API rate limit reached. Please wait a few minutes and try again.';
  if(msg === 'NOT_A_FOLDER') return `"${GITHUB_FOLDER}" doesn't look like a folder in that repository. Check your GitHub repository settings.`;
  return 'Unable to load the Training Library. Check your GitHub repository settings or internet connection.';
}

// Re-queries GitHub and rebuilds the dropdown/list. Called on first open of
// the Training Library screen, and any time "Refresh Library" is tapped.
async function buildLibrary(){
  const prevSelected = state.library.selectedPath;
  state.library.status = 'loading';
  state.library.errorMsg = '';
  render();
  try{
    const tree = await scanGithubFolder(GITHUB_FOLDER, '');
    const flatFiles = collectLibraryFiles(tree);
    state.library.tree = tree;
    state.library.flatFiles = flatFiles;
    state.library.groups = flattenLibraryGroups(tree, '');
    state.library.defaultFile = (tree.files || []).find(f => f.isIndex) || null;
    state.library.status = flatFiles.length ? 'ready' : 'empty';

    // Keep the current selection if it still exists after refresh, otherwise
    // fall back to the default (index.html) file if one exists.
    const stillExists = prevSelected && flatFiles.find(f => f.path === prevSelected);
    if(stillExists){
      await openLibraryFile(prevSelected, true);
    } else if(state.library.defaultFile){
      await openLibraryFile(state.library.defaultFile.path, true);
    } else {
      state.library.selectedPath = null;
      state.library.htmlContent = null;
      state.library.pdfUrl = null;
    }
  }catch(e){
    console.error('Training library load failed', e);
    state.library.status = 'error';
    state.library.errorMsg = libraryErrorMessage(e);
  }
  render();
}

// Loads one module (HTML or PDF) into the embedded viewer.
async function openLibraryFile(path, skipRender){
  const file = state.library.flatFiles.find(f => f.path === path);
  if(!file) return;
  state.library.selectedPath = path;
  state.library.contentLoading = true;
  state.library.contentError = '';
  state.library.contentType = file.ext;
  state.library.htmlContent = null;
  state.library.pdfUrl = null;
  if(!skipRender) render();
  try{
    if(file.ext === 'pdf'){
      // PDFs render natively in an iframe using the browser's built-in viewer.
      state.library.pdfUrl = file.downloadUrl;
    } else {
      // Fetch the raw HTML ourselves (rather than pointing an iframe straight
      // at raw.githubusercontent.com) so we can inject a <base> tag — this
      // keeps relative links/assets inside the page working correctly.
      const res = await fetch(file.downloadUrl);
      if(!res.ok) throw new Error('LOAD_FAILED');
      let html = await res.text();
      const baseHref = file.downloadUrl.substring(0, file.downloadUrl.lastIndexOf('/') + 1);
      if(/<head[^>]*>/i.test(html)){
        html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${baseHref}">`);
      } else {
        html = `<base href="${baseHref}">` + html;
      }
      state.library.htmlContent = html;
    }
  }catch(e){
    console.error('Module load failed', e);
    state.library.contentError = 'This module could not be loaded. It may have been renamed or removed on GitHub.';
  }
  state.library.contentLoading = false;
  if(!skipRender) render();
}

// Entry point from the dashboard tile — only fetches from GitHub the first

    </optgroup>

function renderTrainingLibrary(){
  const lib = state.library;
  let inner = '';

  if(lib.status === 'idle' || lib.status === 'loading'){
    inner = `<div class="empty">📡 Loading Training Library…</div>`;
  } else if(lib.status === 'error'){
    inner = `
      <div class="warn-box" style="border-color:var(--red);background:rgba(193,71,59,.1);color:#F0B9B4;">
        ⚠️ ${lib.errorMsg || 'Unable to load the Training Library. Check your GitHub repository settings or internet connection.'}
      </div>
      <button class="btn secondary" style="margin-top:14px" onclick="buildLibrary()">Try Again</button>
    `;
  } else if(lib.status === 'empty'){
    inner = `<div class="empty">No training files found yet in "${GITHUB_FOLDER}". Add an .html or .pdf file to that GitHub folder, then tap Refresh Library.</div>`;
  } else {
    inner = `
      <label>Training Module</label>

        <option value="">— Select a module —</option>

        ${(!lib.selectedPath && !lib.contentLoading) ? `<div class="empty">Select a training module to begin.</div>` : ''}
        <div id="libraryViewer"></div>

    `;
  }

  return `
    ${topbar('Training Library', 'RealEstate Modules')}
    <main>
      <div class="btn-row" style="margin-bottom:14px">
        <button class="btn secondary" onclick="buildLibrary()">🔄 Refresh Library</button>
      </div>
      <div class="card">${inner}</div>
    </main>
  `;
}

// Mounts the actual iframe via direct DOM access (not template-string HTML)
// so PDF/HTML content never has to be escaped into an inline attribute.
function mountLibraryViewer(){
  const viewer = document.getElementById('libraryViewer');
  if(!viewer) return;
  const lib = state.library;
  if(lib.contentLoading || lib.contentError || !lib.selectedPath) return;
  if(lib.contentType === 'pdf' && lib.pdfUrl){
    viewer.innerHTML = `<iframe class="lib-frame" src="${lib.pdfUrl}" title="PDF training module"></iframe>`;
  } else if(lib.contentType === 'html' && lib.htmlContent){
    viewer.innerHTML = `<iframe class="lib-frame" id="libraryFrame" title="Training module"></iframe>`;
    const frame = document.getElementById('libraryFrame');
    if(frame) frame.srcdoc = lib.htmlContent;
  }
}

function go(screen, extra){
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------------- CALL ENGINE ---------------- */
function newScenario(){
  const name = pick(NAMES);
  const address = Math.floor(100+Math.random()*899) + ' ' + pick(STREETS) + ', ' + pick(CITIES);
  const personality = pick(PERSONALITIES);
  const opening = fill(pick(OPENINGS), {name, address});
  const startNode = pick(personality.weight);
  return {
    id: uid(), name, address, personality, opening,
    node: startNode,
    transcript: [{speaker:'braylen', tag:'Opening line', text: opening}],
    log: [], // {quality}
    argued: false,
    leadCaptured: null,
    outcome: null
  };
}

function startCall(){
  state.call = newScenario();
  state.qualAnswers = null;
  go('practiceCall');
}

function currentNode(){
  let n = GRAPH[state.call.node];
  if(n && n.router){
    // resolve router into a real node once, then replace
    const target = pick(n.options);
    state.call.node = target;
    n = GRAPH[target];
  }
  return n;
}

function renderPracticeCall(){
  const c = state.call;
  if(!c) return renderDashboard();

  if(c.node && c.node.startsWith && c.node.startsWith('END_')){
    return renderCallEnd();
  }
  if(c.node === 'LEAD_QUAL_FLOW'){
    return renderQualFlow();
  }
  if(c.node === 'LEAD_CAPTURE_LANDSCAPING' || c.node === 'LEAD_CAPTURE_CLEANING' || c.node === 'LEAD_CAPTURE_SALE'){
    const label = c.node === 'LEAD_CAPTURE_LANDSCAPING' ? 'Landscaping' : c.node === 'LEAD_CAPTURE_CLEANING' ? 'House Cleaning' : 'Sale Interest';
    return renderLeadCaptureForm(label);
  }

  const node = currentNode();
  if(!node){ return renderCallEnd(); }

  // append homeowner line if not already logged for this node visit
  const lastEntry = c.transcript[c.transcript.length-1];
  const hLine = fill(Array.isArray(node.homeowner) ? pick(node.homeowner) : node.homeowner, c);
  if(!lastEntry || lastEntry.nodeMarker !== c.node){
    c.transcript.push({speaker:'homeowner', tag: c.personality.label, text: hLine, nodeMarker: c.node});
  }

  const meterPct = Math.max(8, Math.min(100, 55 + (c.log.filter(l=>l.quality==='good').length*10) - (c.log.filter(l=>l.quality==='bad').length*18) - (c.log.filter(l=>l.quality==='ok').length*4)));
  const signalClass = meterPct>65?'good':meterPct>35?'warn':'bad';

  return `
    ${topbar('Live Call', c.name)}
    <main>
      <div class="console">
        <div class="console-head">
          <div class="who">Calling <b>${c.name}</b> · ${c.address}</div>
          <div class="signal ${signalClass}"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${meterPct}%"></div></div>
        <div class="transcript">
          ${c.transcript.map(t=>{
            if(t.speaker==='verdict'){
              return `<div class="bubble verdict ${t.quality}">${t.quality==='good'?'✅':t.quality==='ok'?'⚠️':'❌'} ${t.text}</div>`;
            }
            return `<div class="bubble ${t.speaker}"><span class="tag">${t.speaker==='homeowner'?t.tag:'Braylen'}</span>${t.text}</div>`;
          }).join('')}
        </div>
        <div class="choices" id="choiceBox">
          ${node.choices.map((ch,i)=>`
            <button class="choice" onclick="pickChoice(${i})">
              <span class="qmark">SAY</span>${fill(ch.text, c)}
            </button>
          `).join('')}
        </div>
      </div>
      <button class="btn ghost" onclick="if(confirm('End this call early?')) endCall('END_NOT_INTERESTED')">End call early</button>
    </main>
  `;
}

function pickChoice(i){
  const c = state.call;
  const node = currentNode();
  const ch = node.choices[i];
  c.log.push({quality: ch.quality});
  c.transcript.push({speaker:'braylen', tag:'Braylen', text: fill(ch.text, c)});
  if(ch.quality !== 'neutral'){
    c.transcript.push({speaker:'verdict', quality: ch.quality, text: fill(ch.feedback, c)});
  }
  if(ch.quality === 'bad' && (node === GRAPH.not_interested || node === GRAPH.argue_end)) c.argued = true;
  c.node = ch.next;
  render();
}

function renderQualFlow(){
  const c = state.call;
  if(!state.qualAnswers){
    state.qualAnswers = QUAL_QUESTIONS.map(()=>null);
  }
  const answered = state.qualAnswers.every(a=>a!==null);
  return `
    ${topbar('Qualifying', c.name)}
    <main>
      <div class="console">
        <div class="console-head"><div class="who">Calling <b>${c.name}</b> · ${c.address}</div></div>
        <div class="transcript">
          ${c.transcript.slice(-2).map(t=>`<div class="bubble ${t.speaker}"><span class="tag">${t.speaker==='homeowner'?t.tag:'Braylen'}</span>${t.text}</div>`).join('')}
        </div>
      </div>
      <div class="section-title">Quick Qualification</div>
      ${QUAL_QUESTIONS.map((q,i)=>`
        <div class="qa-row">
          <div class="q">${q}</div>
          <div class="toggle-row">
            <div class="toggle ${state.qualAnswers[i]===true?'on':''}" onclick="setQual(${i},true)">Yes</div>
            <div class="toggle ${state.qualAnswers[i]===false?'on':''}" onclick="setQual(${i},false)">No</div>
          </div>
        </div>
      `).join('')}
      <button class="btn" ${answered?'':'disabled'} onclick="finishQual()">See Classification →</button>
    </main>
  `;
}
function setQual(i,val){ state.qualAnswers[i]=val; render(); }
function finishQual(){
  const c = state.call;
  const yes = state.qualAnswers.filter(a=>a===true).length;
  c.qualScore = yes;
  c.qualAnswers = state.qualAnswers.slice();
  if(state.qualAnswers[0]===true){
    c.node = 'LEAD_CAPTURE_SALE';
  } else if(state.qualAnswers[7]===true){
    c.node = 'LEAD_CAPTURE_LANDSCAPING';
  } else {
    c.node = 'END_NOT_INTERESTED';
  }
  render();
}

function renderCallEnd(){
  const c = state.call;
  if(!c.finalized) finalizeScore();

  const OUTCOME_META = {
    END_DNC: {label:'Do Not Contact', badge:'dnc', icon:'🔴'},
    END_NOT_INTERESTED: {label:'Not Interested', badge:'cold', icon:'⚪'},
    END_NO_SERVICE: {label:'Not Interested', badge:'cold', icon:'⚪'},
    END_HANGUP: {label:'Call Ended Early', badge:'cold', icon:'⚪'},
    END_CALLBACK_LATER: {label:'Callback Scheduled', badge:'warm', icon:'🟡'},
    END_INTERESTED: {label: c.qualAnswers && c.qualAnswers[0] ? 'Hot Lead' : 'Service Opportunity', badge: c.qualAnswers && c.qualAnswers[0] ? 'hot' : 'service', icon: c.qualAnswers && c.qualAnswers[0] ? '🟢':'🔵'}
  };
  const meta = OUTCOME_META[c.outcome] || {label:'Call Complete', badge:'cold', icon:'⚪'};

  return `
    ${topbar('Debrief', c.name)}
    <main>
      <div class="card" style="text-align:center">
        <div class="badge ${meta.badge}">${meta.icon} ${meta.label}</div>
        <div class="score-big">${c.score}</div>
        <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;">out of 100</div>
      </div>
      <div class="card">
        ${Object.entries(c.scoreBreakdown).map(([k,v])=>`
          <div class="score-row"><span>${k}</span><span class="v ${v.cls}">${v.text}</span></div>
        `).join('')}
      </div>
      ${c.leadCaptured?`<div class="card"><div class="section-title" style="margin-top:0">Lead Saved</div><p class="copy" style="margin:0">${c.leadCaptured.name} · ${c.leadCaptured.service||'—'}</p></div>`:''}
      <div class="btn-row">
        <button class="btn secondary" onclick="go('dashboard')">Console</button>
        <button class="btn" onclick="startCall()">Next Call</button>
      </div>
    </main>
  `;
}
function finalizeScore(){
  const c = state.call;
  const good = c.log.filter(l=>l.quality==='good').length;
  const ok = c.log.filter(l=>l.quality==='ok').length;
  const bad = c.log.filter(l=>l.quality==='bad').length;
  let score = 70 + good*8 - ok*2 - bad*16;
  if(c.argued) score -= 10;
  if(c.leadCaptured) score += 12;
  if(c.outcome==='END_DNC' && bad>0) score -= 6;
  score = Math.max(5, Math.min(100, Math.round(score)));
  c.score = score;
  c.scoreBreakdown = {
    'Natural opening': good>0?{cls:'good',text:'✅ Good'}:{cls:'ok',text:'⚠️ Could improve'},
    'Handled objections': bad===0?{cls:'good',text:'✅ Smooth'}:bad===1?{cls:'ok',text:'⚠️ One rough patch'}:{cls:'bad',text:'❌ Struggled'},
    'Avoided arguing': c.argued?{cls:'bad',text:'❌ Pushed back on a no'}:{cls:'good',text:'✅ Stayed respectful'},
    'Ended appropriately': /END_/.test(c.outcome)?{cls:'good',text:'✅ Clean close'}:{cls:'ok',text:'⚠️ Unclear'},
    'Captured lead info': c.leadCaptured?{cls:'good',text:'✅ Captured'}:{cls:'ok',text:'— N/A this call'}
  };
  c.finalized = true;
  state.progress.calls++;
  state.progress.totalScore += score;
  state.progress.history.unshift({date: Date.now(), name:c.name, personality:c.personality.label, outcome:c.outcome, score});
  state.progress.history = state.progress.history.slice(0,40);
  saveProgress();
}

/* ---------------- PUSHBACK LIBRARY DRILL ---------------- */
function startPushback(){
  state.pushbackOrder = PUSHBACK_LIBRARY.map((_,i)=>i).sort(()=>Math.random()-0.5);
  state.pushbackIdx = 0;
  state.pushbackScore = {good:0, ok:0, bad:0};
  go('pushback');
}
function renderPushback(){
  if(state.pushbackIdx >= state.pushbackOrder.length){
    const s = state.pushbackScore;
    const total = s.good+s.ok+s.bad;
    return `
      ${topbar('Drill Complete', 'Pushback Library')}
      <main>
        <div class="card" style="text-align:center">
          <div class="badge ${s.bad===0?'hot':'warm'}">${s.bad===0?'🟢 Sharp':'🟡 Keep Practicing'}</div>
          <div class="score-big">${s.good}/${total}</div>
          <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;">best responses picked</div>
        </div>
        <div class="card">
          <div class="score-row"><span>✅ Good</span><span class="v good">${s.good}</span></div>
          <div class="score-row"><span>⚠️ Okay</span><span class="v ok">${s.ok}</span></div>
          <div class="score-row"><span>❌ Poor</span><span class="v bad">${s.bad}</span></div>
        </div>
        <div class="btn-row">
          <button class="btn secondary" onclick="go('dashboard')">Console</button>
          <button class="btn" onclick="startPushback()">Run Again</button>
        </div>
      </main>
    `;
  }
  const idx = state.pushbackOrder[state.pushbackIdx];
  const item = PUSHBACK_LIBRARY[idx];
  const options = item._shuffled || (item._shuffled = item.options.map((o,i)=>({...o,i})).sort(()=>Math.random()-0.5));
  return `
    ${topbar(`${state.pushbackIdx+1} / ${state.pushbackOrder.length}`, 'Handle Pushback')}
    <main>
      <div class="console">
        <div class="console-head"><div class="who">Homeowner says</div></div>
        <div class="transcript">
          <div class="bubble homeowner"><span class="tag">Homeowner</span>"${item.line}"</div>
        </div>
        <div class="choices">
          ${options.map(o=>`<button class="choice" onclick="answerPushback(${idx}, '${o.quality}', ${o.i})"><span class="qmark">SAY</span>${o.text}</button>`).join('')}
        </div>
      </div>
    </main>
  `;
}
function answerPushback(idx, quality, optIdx){
  state.pushbackScore[quality] = (state.pushbackScore[quality]||0)+1;
  const item = PUSHBACK_LIBRARY[idx];
  const chosen = item.options[optIdx];
  const verdictIcon = quality==='good'?'✅':quality==='ok'?'⚠️':'❌';
  document.getElementById('app').insertAdjacentHTML('beforeend', `
    <div id="pbToast" style="position:fixed;inset:0;background:rgba(10,13,18,.88);z-index:60;display:flex;align-items:flex-end;">
      <div style="width:100%;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:22px 20px 26px;">
        <div class="bubble verdict ${quality}" style="margin-bottom:14px">${verdictIcon} ${chosen.feedback}</div>
        <button class="btn" onclick="this.closest('#pbToast').remove(); advancePushback()">Next →</button>
      </div>
    </div>
  `);
}
function advancePushback(){ state.pushbackIdx++; render(); }

/* ---------------- STANDALONE LEAD QUALIFICATION ---------------- */
function renderLeadQualStandalone(){
  if(!state.standaloneQual) state.standaloneQual = QUAL_QUESTIONS.map(()=>null);
  const answers = state.standaloneQual;
  const answered = answers.filter(a=>a!==null).length;
  let result = null;
  if(answered === QUAL_QUESTIONS.length){
    const yes = answers.filter(a=>a===true).length;
    if(answers[0] && yes>=5) result = {label:'HOT', cls:'hot', icon:'🟢', desc:'Ready to move — prioritize a follow-up call and start paperwork prep.'};
    else if(answers[0]) result = {label:'WARM', cls:'warm', icon:'🟡', desc:'Interested but not urgent — stay in the follow-up rotation.'};
    else if(answers[7]) result = {label:'SERVICE OPPORTUNITY', cls:'service', icon:'🔵', desc:'Not a sale, but a landscaping/cleaning lead worth capturing.'};
    else if(answers[0]===false) result = {label:'NOT INTERESTED', cls:'cold', icon:'⚪', desc:'No current interest — keep for a future check-in.'};
    else result = {label:'NOT INTERESTED', cls:'cold', icon:'⚪', desc:'No current interest — keep for a future check-in.'};
  }
  return `
    ${topbar('Score a Lead', 'Lead Qualification')}
    <main>
      ${QUAL_QUESTIONS.map((q,i)=>`
        <div class="qa-row">
          <div class="q">${q}</div>
          <div class="toggle-row">
            <div class="toggle ${answers[i]===true?'on':''}" onclick="setStandaloneQual(${i},true)">Yes</div>
            <div class="toggle ${answers[i]===false?'on':''}" onclick="setStandaloneQual(${i},false)">No</div>
          </div>
        </div>
      `).join('')}
      ${result?`
        <div class="card" style="text-align:center;margin-top:16px">
          <div class="badge ${result.cls}">${result.icon} ${result.label}</div>
          <p class="copy" style="margin-top:12px">${result.desc}</p>
        </div>
      `:''}
      <button class="btn secondary" style="margin-top:16px" onclick="state.standaloneQual=null; go('dashboard')">Back to Console</button>
    </main>
  `;
}
function setStandaloneQual(i,val){ state.standaloneQual[i]=val; render(); }

/* ---------------- SAVE / VIEW LEADS ---------------- */
async function renderSaveLead(){
  const leads = await getAllLeads();
  const listHtml = leads.length ? leads.map(l=>`
    <div class="history-row">
      <div>
        <div>${l.name||'Unnamed'} ${l.service?`· ${l.service}`:''}</div>
        <div class="meta">${l.address||''}${l.phone?' · '+l.phone:''}</div>
      </div>
      <div class="meta">${l.savedAt?new Date(l.savedAt).toLocaleDateString():''}</div>
    </div>
  `).join('') : `<div class="empty">No leads saved yet. Capture one during a practice call, or add one manually below.</div>`;

  return `
    ${topbar('Leads', 'Save a Lead')}
    <main>
      <div class="card">
        <label>Name</label><input type="text" id="ml_name">
        <label>Phone</label><input type="tel" id="ml_phone">
        <label>Property Address</label><input type="text" id="ml_address">
        <label>Service Needed</label>
        <select id="ml_service">
          <option value="Sale Interest">Sale Interest</option>
          <option value="Landscaping">Landscaping</option>
          <option value="House Cleaning">House Cleaning</option>
          <option value="Other">Other</option>
        </select>
        <label>Best Time to Contact</label><input type="text" id="ml_time">
        <label>Notes</label><textarea id="ml_notes"></textarea>
        <button class="btn" style="margin-top:16px" onclick="submitManualLead()">Save Lead</button>
      </div>
      <div class="section-title">Saved Leads (${leads.length})</div>
      <div class="card">${listHtml}</div>
    </main>
  `;
}
async function submitManualLead(){
  const lead = {
    name: document.getElementById('ml_name').value,
    phone: document.getElementById('ml_phone').value,
    address: document.getElementById('ml_address').value,
    service: document.getElementById('ml_service').value,
    bestTime: document.getElementById('ml_time').value,
    notes: document.getElementById('ml_notes').value,
    savedAt: Date.now()
  };
  if(!lead.name){ toast('Add a name first'); return; }
  await saveLead(lead);
  toast('Lead saved ✅');
  render();
}

/* ---------------- PROGRESS ---------------- */
function renderProgress(){
  const p = state.progress;
  const avg = p.calls ? Math.round(p.totalScore/p.calls) : 0;
  return `
    ${topbar('Stats', 'My Practice Progress')}
    <main>
      <div class="card" style="text-align:center">
        <div class="score-big">${avg}</div>
        <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;">average score · ${p.calls} calls</div>
        <div class="progress-bar-outer" style="margin-top:14px"><div class="progress-bar-inner" style="width:${avg}%"></div></div>
      </div>
      <div class="section-title">Recent Calls</div>
      <div class="card">
        ${p.history.length ? p.history.map(h=>`
          <div class="history-row">
            <div>${h.name} <span class="meta">(${h.personality})</span></div>
            <div class="meta">${h.score} pts</div>
          </div>
        `).join('') : `<div class="empty">No calls yet — run Practice a Call to start building your track record.</div>`}
      </div>
      <button class="btn secondary" onclick="go('dashboard')">Back to Console</button>
    </main>
  `;
}

/* ---------------- shared topbar ---------------- */
function topbar(eyebrow, title){
  return `
    <div class="topbar">
      <button class="back" onclick="go('dashboard')">←</button>
      <div class="titles">
        <p class="eyebrow">${eyebrow}</p>
        <h1>${title}</h1>
      </div>
    </div>
  `;
}

/* ---------------- ROUTER / RENDER ---------------- */
async function render(){
  const app = document.getElementById('app');
  switch(state.screen){
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'findProperty': app.innerHTML = renderFindProperty(); break;
    case 'practiceCall': app.innerHTML = renderPracticeCall(); break;
    case 'pushback': app.innerHTML = renderPushback(); break;
    case 'leadQualStandalone': app.innerHTML = renderLeadQualStandalone(); break;
    case 'saveLead': app.innerHTML = '<main class="empty">Loading…</main>'; app.innerHTML = await renderSaveLead(); break;
    case 'progress': app.innerHTML = renderProgress(); break;
    case 'howToUse': app.innerHTML = renderHowToUse(); break;
    case 'trainingLibrary': app.innerHTML = renderTrainingLibrary(); mountLibraryViewer(); break;
    default: app.innerHTML = renderDashboard();
  }
  // sync pill lives outside the router-managed #app content
  let pill = document.getElementById('syncPill');
  if(!pill){
    document.body.insertAdjacentHTML('beforeend', `<div class="sync-pill" id="syncPill"><span class="dot"></span><span class="label">Syncing…</span><button class="logout" onclick="handleSignOut()">Sign out</button></div>`);
  }
}

function startApp(){
  render(); // paint immediately so the UI isn't blank while Firestore loads
  loadProgress().then(render);
}

(function init(){
  if(!fbReady){ startApp(); return; }
  auth.onAuthStateChanged(function(user){
    currentUser = user;
    if(user){
      startApp();
    }else{
      renderAuthScreen();
    }
  });
})();
</script>

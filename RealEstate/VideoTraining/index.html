<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Video Training | Real Estate</title>

  <style>

    :root {
      --bg: #080808;
      --card: #121212;
      --line: #292929;
      --text: #f5f5f5;
      --muted: #999;
      --accent: #00e676;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0,230,118,.12),
          transparent 40%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .page {
      width: min(100%, 650px);
      padding: 25px;
    }

    .card {
      padding: 40px 28px;
      text-align: center;

      background: var(--card);

      border: 1px solid var(--line);
      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.4);
    }

    .eyebrow {
      display: inline-block;

      padding: 7px 12px;

      border: 1px solid rgba(0,230,118,.25);
      border-radius: 999px;

      color: var(--accent);

      font-size: 11px;
      font-weight: 900;

      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 22px 0 12px;

      font-size: clamp(38px, 9vw, 60px);

      line-height: .95;

      letter-spacing: -.05em;
    }

    h1 span {
      color: var(--accent);
    }

    .description {
      margin: 0 auto 28px;

      max-width: 480px;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.6;
    }

    .watch-button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      min-height: 64px;

      padding: 0 20px;

      background: var(--accent);
      color: #000;

      border-radius: 15px;

      text-decoration: none;

      font-size: 16px;
      font-weight: 950;

      transition: .2s ease;

      box-shadow:
        0 12px 35px rgba(0,230,118,.15);
    }

    .watch-button:hover {
      background: #fff;

      transform: translateY(-2px);
    }

    .back-button {
      display: inline-block;

      margin-top: 18px;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .back-button:hover {
      color: white;
    }

    .note {
      margin-top: 25px;

      padding-top: 18px;

      border-top: 1px solid #222;

      color: #666;

      font-size: 11px;
    }

  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="eyebrow">
        Real Estate Training
      </div>

      <h1>
        Video<br>
        <span>Training</span>
      </h1>

      <p class="description">
        Watch the training videos below to learn the lead-generation
        process, property research, seller outreach, and other
        real estate strategies.
      </p>

      <!-- REPLACE THIS URL WITH YOUR UNLISTED PLAYLIST -->
      <a
        class="watch-button"
        href="YOUR_UNLISTED_YOUTUBE_PLAYLIST_URL"
        target="_blank"
        rel="noopener noreferrer"
      >
        ▶ WATCH TRAINING PLAYLIST
      </a>

      <a
        class="back-button"
        href="https://radiomeltdown.com/RealEstate/"
      >
        ← Back to Main Dashboard
      </a>

      <div class="note">
        Training materials are intended for internal educational use.
      </div>

    </section>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STV Radiomeltdown · The Switchblades</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #0d0d0f;
      --bg2: #141416;
      --bg3: #1a1a1d;
      --text: #e8e8e4;
      --dim: #8a8a84;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --red: #e8312a;
      --red-dim: rgba(232,49,42,0.15);
      --red-glow: rgba(232,49,42,0.3);
      --gold: #c8a84b;
      --blue: #85B7EB;
      --blue-bg: rgba(4,44,83,0.6);
      --r: 6px;
      --rl: 10px;
      --mono: 'Share Tech Mono', monospace;
      --head: 'Oswald', sans-serif;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0 1rem 3rem;
      position: relative;
      overflow-x: hidden;
    }
    /* =========================================
       SWITCHBLADES BACKGROUND
       ========================================= */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          rgba(13,13,15,0.78),
          rgba(13,13,15,0.94)
        ),
        url("Swb1.JPG") center top / cover no-repeat;
      opacity: 0.9;
      z-index: -2;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(232,49,42,0.12),
          transparent 45%
        );
      z-index: -1;
      pointer-events: none;
    }
    #app {
      width: 100%;
      max-width: 500px;
    }
    /* ===== STATION HEADER ===== */
    .stn-header {
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .stn-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
      gap: 10px;
    }
    .stn-name {
      font-family: var(--head);
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .stn-name .stv {
      color: var(--red);
      text-shadow: 0 0 20px var(--red-glow);
    }
    .on-air {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--red);
      padding: 4px 9px;
      border: 1px solid var(--red);
      border-radius: 3px;
      background: var(--red-dim);
      opacity: 0;
      transition: opacity 0.3s;
      flex-shrink: 0;
    }
    .on-air.live {
      opacity: 1;
    }
    .on-air-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .stn-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .stn-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1px;
      flex-wrap: wrap;
    }
    .freq {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
    }
    /* ===== GAME ===== */
    .game-lbl {
      font-family: var(--head);
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--dim);
      margin-bottom: 10px;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .diff-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(20,20,22,0.88);
      color: var(--dim);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 1px;
    }
    .diff-btn.active {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }
    .diff-btn:hover:not(.active) {
      background: var(--bg3);
      border-color: var(--border2);
    }
    .new-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: rgba(20,20,22,0.88);
      color: var(--text);
      cursor: pointer;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 1px;
    }
    .new-btn:hover {
      background: var(--bg3);
    }
    .status-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--dim);
      font-family: var(--mono);
    }
    .stat span {
      font-weight: 600;
      color: var(--text);
    }
    .board-wrap {
      border: 1px solid var(--border2);
      border-radius: var(--r);
      overflow: hidden;
      width: 100%;
      background: rgba(13,13,15,0.9);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(9,1fr);
      width: 100%;
      aspect-ratio: 1;
    }
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(13px,3vw,20px);
      cursor: pointer;
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      transition: background 0.1s;
      user-select: none;
      background: rgba(20,20,22,0.92);
    }
    .cell:nth-child(3n) {
      border-right: 1px solid var(--border2);
    }
    .cell:nth-child(9n) {
      border-right: none;
    }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 1px solid var(--border2);
    }
    .cell:nth-child(n+73):nth-child(-n+81) {
      border-bottom: none;
    }
    .cell.given {
      font-weight: 700;
      color: var(--text);
      font-family: var(--head);
    }
    .cell.user {
      color: var(--blue);
      font-family: var(--head);
    }
    .cell.selected {
      background: var(--blue-bg) !important;
    }
    .cell.highlight {
      background: var(--bg3);
    }
    .cell.error {
      color: var(--red) !important;
    }
    .notes {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-template-rows: repeat(3,1fr);
      width: 100%;
      height: 100%;
      padding: 2px;
    }
    .note {
      font-size: 7px;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
    }
    .numpad {
      display: grid;
      grid-template-columns: repeat(9,1fr);
      gap: 4px;
      margin-top: 12px;
    }
    .num-btn {
      aspect-ratio: 1;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: rgba(20,20,22,0.94);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      color: var(--text);
      font-family: var(--head);
    }
    .num-btn:hover {
      background: var(--bg3);
      border-color: var(--border2);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .act-btn {
      flex: 1;
      padding: 8px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: rgba(20,20,22,0.94);
      font-size: 11px;
      cursor: pointer;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.1s;
      font-family: var(--mono);
      letter-spacing: 1px;
    }
    .act-btn:hover {
      background: var(--bg3);
    }
    .act-btn.active {
      color: var(--blue);
      border-color: var(--blue);
    }
    .win-msg {
      margin-top: 1rem;
      padding: 14px 16px;
      background: rgba(20,20,22,0.95);
      border-radius: var(--rl);
      border: 1px solid var(--gold);
      text-align: center;
      display: none;
    }
    .win-msg.show {
      display: block;
    }
    .win-msg p {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      font-family: var(--head);
      letter-spacing: 2px;
      color: var(--gold);
    }
    .win-msg small {
      font-size: 11px;
      color: var(--dim);
      font-family: var(--mono);
    }
    /* ===== RADIO PLAYER ===== */
    .radio {
      margin-top: 1.5rem;
      border: 1px solid var(--border2);
      border-radius: var(--rl);
      overflow: hidden;
      background: rgba(20,20,22,0.96);
      backdrop-filter: blur(8px);
    }
    .radio-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(
        135deg,
        rgba(26,18,8,0.96) 0%,
        rgba(15,15,18,0.96) 100%
      );
      border-bottom: 1px solid var(--border);
    }
    .radio-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .radio-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--red-dim);
      border: 1px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-size: 16px;
      box-shadow: 0 0 10px var(--red-glow);
      flex-shrink: 0;
    }
    .radio-titles {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .radio-title {
      font-family: var(--head);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
    }
    .radio-title .stv {
      color: var(--red);
    }
    .radio-now {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
      letter-spacing: 1px;
    }
    .chevron {
      font-size: 14px;
      color: var(--dim);
      transition: transform 0.2s;
    }
    .chevron.open {
      transform: rotate(180deg);
    }
    .radio-body {
      display: none;
    }
    .radio-body.open {
      display: block;
    }
    /* ===== VU ===== */
    .vu {
      padding: 10px 16px 0;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 34px;
    }
    .vu-bar {
      flex: 1;
      border-radius: 1px;
      background: var(--red);
      opacity: 0.25;
      min-height: 3px;
      transition: height 0.1s;
    }
    .vu-bar.live {
      opacity: 0.8;
    }
    /* ===== TRACK INFO ===== */
    .track-info {
      padding: 10px 16px 0;
    }
    .track-name {
      font-family: var(--head);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }
    .track-name.empty {
      color: var(--dim);
      font-weight: 400;
      font-style: italic;
      font-family: var(--mono);
      font-size: 12px;
    }
    .prog-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tlbl {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      min-width: 32px;
    }
    .tlbl.r {
      text-align: right;
    }
    .prog-bar {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      cursor: pointer;
    }
    .prog-fill {
      height: 100%;
      background: var(--red);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }
    /* ===== TRANSPORT ===== */
    .transport {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 16px 14px;
    }
    .tp {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 16px;
      transition: all 0.1s;
    }
    .tp:hover {
      background: var(--bg3);
      color: var(--text);
      border-color: var(--border2);
    }
    .tp.play {
      width: 46px;
      height: 46px;
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      font-size: 20px;
      box-shadow: 0 0 16px var(--red-glow);
    }
    .tp.play:hover {
      opacity: 0.85;
    }
    .tp.on {
      color: var(--gold);
      border-color: var(--gold);
    }
    /* ===== VOLUME ===== */
    .vol-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 12px;
    }
    .vol-row i {
      font-size: 15px;
      color: var(--dim);
    }
    .vol-row input {
      flex: 1;
      accent-color: var(--red);
      cursor: pointer;
    }
    /* ===== UPLOAD ===== */
    .upload-row {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .upload-btn {
      font-family: var(--mono);
      font-size: 10px;
      padding: 6px 12px;
      border-radius: var(--r);
      border: 1px solid var(--red);
      background: var(--red-dim);
      color: var(--red);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.1s;
      letter-spacing: 1px;
    }
    .upload-btn:hover {
      background: rgba(232,49,42,0.25);
    }
    .upload-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 1px;
    }
    /* ===== PLAYLIST ===== */
    .playlist {
      border-top: 1px solid var(--border);
      max-height: 300px;
      overflow-y: auto;
    }
    .pl-section {
      padding: 7px 16px;
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .pl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.1s;
    }
    .pl-item:last-child {
      border-bottom: none;
    }
    .pl-item:hover {
      background: var(--bg3);
    }
    .pl-item.active {
      background: rgba(232,49,42,0.1);
    }
    .pl-item.active .pl-name {
      color: var(--red);
    }
    .pl-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      min-width: 18px;
      text-align: right;
    }
    .pl-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-family: var(--head);
      letter-spacing: 0.5px;
    }
    .built-in {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .pl-del {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      font-size: 13px;
      color: var(--dim);
      opacity: 0;
      transition: opacity 0.1s;
    }
    .pl-item:hover .pl-del {
      opacity: 1;
    }
    .pl-del:hover {
      color: var(--red);
    }
    .pl-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      width: 14px;
    }
    .pl-bar {
      width: 3px;
      background: var(--red);
      border-radius: 1px;
      animation: eq 0.6s infinite alternate;
    }
    .pl-bar:nth-child(2) {
      animation-delay: 0.2s;
    }
    .pl-bar:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes eq {
      0% { height: 3px; }
      100% { height: 12px; }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- =========================================
       STATION HEADER
       ========================================= -->
  <div class="stn-header">
    <div class="stn-top">
      <div>
        <div class="stn-name">
          <span class="stv">STV</span> RADIOMELTDOWN
        </div>
        <div class="stn-tag">
          The Switchblades · Game Series
        </div>
      </div>
      <div class="on-air" id="onAir">
        <div class="on-air-dot"></div>
        ON AIR
      </div>
    </div>
    <div class="stn-meta">
      <span class="freq">radiomeltdown.com</span>
      <span>·</span>
      <span>STUDIO NOIR</span>
      <span>·</span>
      <span id="clock">--:--</span>
    </div>
  </div>
  <!-- =========================================
       SUDOKU
       ========================================= -->
  <div class="game-lbl">
    NOW PLAYING · SWITCHBLADOKU
  </div>
  <div class="controls">
    <button class="diff-btn active"
      onclick="setDiff('easy')">
      EASY
    </button>
    <button class="diff-btn"
      onclick="setDiff('medium')">
      MEDIUM
    </button>
    <button class="diff-btn"
      onclick="setDiff('hard')">
      HARD
    </button>
    <button class="new-btn"
      onclick="newGame()">
      <i class="ti ti-refresh"
        aria-hidden="true"></i>
      NEW GAME
    </button>
  </div>
  <div class="status-bar">
    <div class="stat">
      <i class="ti ti-clock"
        style="font-size:13px"
        aria-hidden="true"></i>
      <span id="timer">0:00</span>
    </div>
    <div class="stat">
      <i class="ti ti-x"
        style="font-size:13px"
        aria-hidden="true"></i>
      ERRORS:
      <span id="errors">0</span>
    </div>
    <div class="stat">
      <i class="ti ti-layout-grid"
        style="font-size:13px"
        aria-hidden="true"></i>
      LEFT:
      <span id="remaining">0</span>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
  <div class="numpad" id="numpad"></div>
  <div class="actions">
    <button class="act-btn"
      id="noteBtn"
      onclick="toggleNoteMode()">
      <i class="ti ti-pencil"
        aria-hidden="true"></i>
      NOTES
    </button>
    <button class="act-btn"
      onclick="erase()">
      <i class="ti ti-eraser"
        aria-hidden="true"></i>
      ERASE
    </button>
    <button class="act-btn"
      onclick="hint()">
      <i class="ti ti-bulb"
        aria-hidden="true"></i>
      HINT
    </button>
  </div>
  <div class="win-msg" id="winMsg">
    <p>
      ⚡ PUZZLE SOLVED
    </p>
    <small id="winDetail"></small>
  </div>
  <!-- =========================================
       RADIO PLAYER
       ========================================= -->
  <div class="radio">
    <div class="radio-hdr"
      onclick="togglePlayer()">
      <div class="radio-brand">
        <div class="radio-icon">
          <i class="ti ti-broadcast"
            aria-hidden="true"></i>
        </div>
        <div class="radio-titles">
          <div class="radio-title">
            <span class="stv">STV</span>
            RADIOMELTDOWN
          </div>
          <div class="radio-now"
            id="nowLabel">
            — SWITCHBLADES ROTATION
          </div>
        </div>
      </div>
      <i class="ti ti-chevron-down chevron"
        id="chevron"
        aria-hidden="true"></i>
    </div>
    <div class="radio-body"
      id="playerBody">
      <!-- VU METERS -->
      <div class="vu"
        id="vuBar">

          id="hint">

          type="file"

<script>
/* =========================================================
   CLOCK
   ========================================================= */
function tick() {
  const n = new Date();
  const h = n.getHours()
    .toString()
    .padStart(2,'0');
  const m = n.getMinutes()
    .toString()
    .padStart(2,'0');
  document.getElementById('clock').textContent =
    h + ':' + m;
}
tick();
setInterval(tick,10000);
/* =========================================================
   SUDOKU
   ========================================================= */
let grid = [];
let solution = [];
let given = [];
let notes = [];
let selected = null;
let errors = 0;
let difficulty = 'easy';
let noteMode = false;
let timerSec = 0;
let timerInt = null;
let won = false;
function solveSudoku(g) {
  const empty = [];
  for(let i=0;i<81;i++) {
    if(g[i]===0)
      empty.push(i);
  }
  function valid(g,idx,n) {
    const r = Math.floor(idx/9);
    const c = idx%9;
    for(let i=0;i<9;i++) {
      if(g[r*9+i]===n)
        return false;
      if(g[i*9+c]===n)
        return false;
    }
    const br = Math.floor(r/3)*3;
    const bc = Math.floor(c/3)*3;
    for(let dr=0;dr<3;dr++) {
      for(let dc=0;dc<3;dc++) {
        if(
          g[(br+dr)*9+(bc+dc)]===n
        )
          return false;
      }
    }
    return true;
  }
  function solve(pos) {
    if(pos===empty.length)
      return true;
    const idx = empty[pos];
    const nums =
      [1,2,3,4,5,6,7,8,9]
      .sort(()=>Math.random()-0.5);
    for(let n of nums) {
      if(valid(g,idx,n)) {
        g[idx]=n;
        if(solve(pos+1))
          return true;
        g[idx]=0;
      }
    }
    return false;
  }
  solve(0);
  return g;
}
function generatePuzzle(diff) {
  let s = Array(81).fill(0);
  solveSudoku(s);
  const sol = [...s];
  const removes =
    diff==='easy'
      ? 36
      : diff==='medium'
        ? 46
        : 54;
  let positions =
    [...Array(81).keys()]
      .sort(()=>Math.random()-0.5);
  let removed = 0;
  let p = [...s];
  for(let idx of positions) {
    if(removed>=removes)
      break;
    p[idx]=0;
    removed++;
  }
  return {
    puzzle:p,
    solution:sol
  };
}
function newGame() {
  clearInterval(timerInt);
  timerSec=0;
  won=false;
  const result =
    generatePuzzle(difficulty);
  grid=[...result.puzzle];
  solution=result.solution;
  given =
    grid.map(v=>v!==0);
  notes =
    Array(81)
      .fill(null)
      .map(()=>new Set());
  errors=0;
  selected=null;
  document.getElementById('errors')
    .textContent='0';
  document.getElementById('timer')
    .textContent='0:00';
  document.getElementById('winMsg')
    .classList.remove('show');
  render();
  updateRemaining();
  timerInt=setInterval(()=>{
    timerSec++;
    const m =
      Math.floor(timerSec/60);
    const s =
      timerSec%60;
    document.getElementById('timer')
      .textContent =
      `${m}:${s.toString().padStart(2,'0')}`;
  },1000);
}
function setDiff(d) {
  difficulty=d;
  document
    .querySelectorAll('.diff-btn')
    .forEach(b =>
      b.classList.toggle(
        'active',
        b.textContent.toLowerCase()===d
      )
    );
  newGame();
}
function render() {
  const board =
    document.getElementById('board');
  board.innerHTML='';
  for(let i=0;i<81;i++) {
    const cell =
      document.createElement('div');
    cell.className='cell';
    cell.dataset.idx=i;
    if(given[i]) {
      cell.classList.add('given');
      cell.textContent=grid[i];
    }
    else if(grid[i]) {
      cell.classList.add('user');
      if(grid[i]!==solution[i])
        cell.classList.add('error');
      cell.textContent=grid[i];
    }
    else if(notes[i].size>0) {
      const nd =
        document.createElement('div');
      nd.className='notes';
      for(let n=1;n<=9;n++) {
        const s =
          document.createElement('div');
        s.className='note';
        s.textContent =
          notes[i].has(n) ? n : '';
        nd.appendChild(s);
      }
      cell.appendChild(nd);
    }
    if(selected===i) {
      cell.classList.add('selected');
    }
    else if(selected!==null) {
      const sr=Math.floor(selected/9);
      const sc=selected%9;
      const sbr=Math.floor(sr/3);
      const sbc=Math.floor(sc/3);
      const r=Math.floor(i/9);
      const c=i%9;
      if(
        r===sr ||
        c===sc ||
        (
          Math.floor(r/3)===sbr &&
          Math.floor(c/3)===sbc
        )
      )
        cell.classList.add('highlight');
      if(
        grid[selected] &&
        grid[i]===grid[selected]
      )
        cell.classList.add('highlight');
    }
    cell.addEventListener(
      'click',
      ()=>selectCell(parseInt(cell.dataset.idx))
    );
    board.appendChild(cell);
  }
  const np =
    document.getElementById('numpad');
  np.innerHTML='';
  for(let n=1;n<=9;n++) {
    const b =
      document.createElement('button');
    b.className='num-btn';
    b.textContent=n;
    b.addEventListener(
      'click',
      ()=>inputNum(n)
    );
    np.appendChild(b);
  }
}
function selectCell(idx) {
  selected=idx;
  render();
}
function inputNum(n) {
  if(
    selected===null ||
    given[selected] ||
    won
  )
    return;
  if(noteMode) {
    if(grid[selected])
      return;
    if(notes[selected].has(n))
      notes[selected].delete(n);
    else
      notes[selected].add(n);
    render();
    return;
  }
  notes[selected].clear();
  if(grid[selected]!==n) {
    if(
      grid[selected]!==0 &&
      grid[selected]!==solution[selected]
    )
      errors--;
    grid[selected]=n;
    if(n!==solution[selected])
      errors++;
    document.getElementById('errors')
      .textContent=errors;
  }
  render();
  updateRemaining();
  checkWin();
}
function erase() {
  if(
    selected===null ||
    given[selected] ||
    won
  )
    return;
  if(
    grid[selected] &&
    grid[selected]!==solution[selected]
  )
    errors--;
  grid[selected]=0;
  notes[selected].clear();
  document.getElementById('errors')
    .textContent=errors;
  render();
  updateRemaining();
}
function hint() {
  if(
    selected===null ||
    given[selected] ||
    won
  )
    return;
  const c=solution[selected];
  if(grid[selected]!==c) {
    if(
      grid[selected] &&
      grid[selected]!==c
    )
      errors--;
    grid[selected]=c;
    notes[selected].clear();
    document.getElementById('errors')
      .textContent=errors;
    render();
    updateRemaining();
    checkWin();
  }
}
function toggleNoteMode() {
  noteMode=!noteMode;
  document
    .getElementById('noteBtn')
    .classList.toggle(
      'active',
      noteMode
    );
}
function updateRemaining() {
  document.getElementById('remaining')
    .textContent =
    grid.filter(v=>v===0).length;
}
function checkWin() {
  if(grid.every((v,i)=>v===solution[i])) {
    won=true;
    clearInterval(timerInt);
    const m =
      Math.floor(timerSec/60);
    const s =
      timerSec%60;
    document.getElementById('winDetail')
      .textContent =
      `Solved in ${m}:${s.toString().padStart(2,'0')} with ${errors} error${errors!==1?'s':''}.`;
    document.getElementById('winMsg')
      .classList.add('show');
  }
}
document.addEventListener('keydown',e=>{
  if(selected===null)
    return;
  if(e.key>='1' && e.key<='9') {
    inputNum(parseInt(e.key));
    return;
  }
  if(
    e.key==='Backspace' ||
    e.key==='Delete'
  ) {
    erase();
    return;
  }
  const r=Math.floor(selected/9);
  const c=selected%9;
  if(
    e.key==='ArrowUp' &&
    r>0
  ) {
    selected=(r-1)*9+c;
    render();
  }
  else if(
    e.key==='ArrowDown' &&
    r<8
  ) {
    selected=(r+1)*9+c;
    render();
  }
  else if(
    e.key==='ArrowLeft' &&
    c>0
  ) {
    selected=r*9+c-1;
    render();
  }
  else if(
    e.key==='ArrowRight' &&
    c<8
  ) {
    selected=r*9+c+1;
    render();
  }
});
newGame();
/* ============================================================
   STV RADIOMELTDOWN — MUSIC PLAYER
   Built-in Switchblades rotation + visitor uploads
   ============================================================ */

const audio = new Audio();
audio.preload = "auto";
audio.volume = 0.8;

const BUILT_IN_TRACKS = [
  {
    name: "The Switchblades - Distant Lover",
    file: "./The%20Switchblades%20-%20Distant%20Lover.mp3",
    builtIn: true
  },
  {
    name: "The Switchblades - More Fire",
    file: "./The%20Switchblades%20-%20More%20Fire.mp3",
    builtIn: true
  },
  {
    name: "The Switchblades - Ghetto Matrix",
    file: "./The%20Switchblades%20-%20Ghetto%20Matrix.mp3",
    builtIn: true
  },
  {
    name: "The Switchblades - Honey (BOOGIE DOWN BRONX VERSION)",
    file: "./The%20Switchblades%20-%20Honey%20(BOOGIE%20DOWN%20BRONX%20VERSION).mp3",
    builtIn: true
  }
];

let tracks = [...BUILT_IN_TRACKS];

let curIdx = 0;
let isPlaying = false;
let shuffleOn = false;
let repeatMode = "all";
let vuInt = null;

/* ============================================================
   PLAYER OPEN/CLOSE
   ============================================================ */

function togglePlayer() {
  const body = document.getElementById("playerBody");
  const chevron = document.getElementById("chevron");

  const open = body.classList.toggle("open");
  chevron.classList.toggle("open", open);
}

/* ============================================================
   FILE UPLOADS
   Uploaded music is temporary/local to this browser.
   Built-in tracks can NEVER be deleted.
   ============================================================ */

function loadFiles(files) {
  const incoming = Array.from(files).filter(file =>
    file.type.startsWith("audio/") ||
    /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(file.name)
  );

  incoming.forEach(file => {
    tracks.push({
      name: file.name.replace(/\.[^.]+$/, "").replace(/[-_]/g, " "),
      url: URL.createObjectURL(file),
      builtIn: false
    });
  });

  updateHint();
  renderPlaylist();

  if (!document.getElementById("playerBody").classList.contains("open")) {
    togglePlayer();
  }
}

/* ============================================================
   STATUS
   ============================================================ */

function updateHint() {
  const uploaded = tracks.filter(t => !t.builtIn).length;

  document.getElementById("hint").textContent =
    uploaded === 0
      ? "4 SWITCHBLADES TRACKS IN ROTATION"
      : `${uploaded} PERSONAL TRACK${uploaded !== 1 ? "S" : ""} ADDED`;
}

/* ============================================================
   LOAD TRACK
   ============================================================ */

function loadTrack(idx, autoPlay = false) {
  if (!tracks.length) return;
  if (idx < 0) idx = tracks.length - 1;
  if (idx >= tracks.length) idx = 0;

  curIdx = idx;

  const track = tracks[curIdx];

  audio.pause();

  audio.src = track.builtIn
    ? new URL(track.file, window.location.href).href
    : track.url;

  audio.load();

  const displayName = track.name.toUpperCase();

  document.getElementById("trackName").textContent = displayName;
  document.getElementById("trackName").classList.remove("empty");

  document.getElementById("nowLabel").textContent =
    "▶ " + displayName;

  document.getElementById("progFill").style.width = "0%";
  document.getElementById("curTime").textContent = "0:00";
  document.getElementById("durTime").textContent = "0:00";

  renderPlaylist();

  if (autoPlay) {
    playAudio();
  }
}

/* ============================================================
   PLAY — IMPORTANT MOBILE FIX
   ============================================================ */

async function playAudio() {
  if (!tracks.length) return;

  try {
    if (!audio.src) {
      loadTrack(curIdx, false);
    }

    await audio.play();

    isPlaying = true;

    document.getElementById("ppIcon").className =
      "ti ti-player-pause";

    document.getElementById("onAir").classList.add("live");

    startVU();
    renderPlaylist();

  } catch (err) {
    console.error("Audio playback failed:", err);

    isPlaying = false;

    document.getElementById("ppIcon").className =
      "ti ti-player-play";

    document.getElementById("onAir").classList.remove("live");

    stopVU();

    document.getElementById("nowLabel").textContent =
      "TAP PLAY AGAIN TO START";
  }
}

function togglePlay() {
  if (!tracks.length) return;

  if (isPlaying) {
    audio.pause();
  } else {
    playAudio();
  }
}

/* ============================================================
   NEXT / PREVIOUS
   ============================================================ */

function nextTrack() {
  if (!tracks.length) return;

  let idx;

  if (shuffleOn && tracks.length > 1) {
    do {
      idx = Math.floor(Math.random() * tracks.length);
    } while (idx === curIdx);
  } else {
    idx = (curIdx + 1) % tracks.length;
  }

  loadTrack(idx, isPlaying);
}

function prevTrack() {
  if (!tracks.length) return;

  const idx =
    curIdx <= 0
      ? tracks.length - 1
      : curIdx - 1;

  loadTrack(idx, isPlaying);
}

/* ============================================================
   SHUFFLE / REPEAT
   ============================================================ */

function toggleShuffle() {
  shuffleOn = !shuffleOn;

  document
    .getElementById("shuffleBtn")
    .classList.toggle("on", shuffleOn);
}

function toggleRepeat() {
  const modes = ["none", "all", "one"];

  repeatMode =
    modes[(modes.indexOf(repeatMode) + 1) % modes.length];

  document
    .getElementById("repeatBtn")
    .classList.toggle(
      "on",
      repeatMode !== "none"
    );

  document.getElementById("repeatIcon").className =
    repeatMode === "one"
      ? "ti ti-repeat-once"
      : "ti ti-repeat";
}

/* ============================================================
   SEEK
   ============================================================ */

function seekTo(e) {
  if (!audio.duration) return;

  const bar = document.getElementById("progBar");
  const rect = bar.getBoundingClientRect();

  const percentage =
    (e.clientX - rect.left) / rect.width;

  audio.currentTime =
    Math.max(0, Math.min(1, percentage)) *
    audio.duration;
}

/* ============================================================
   TIME
   ============================================================ */

function fmt(seconds) {
  if (isNaN(seconds)) return "0:00";

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return `${mins}:${secs
    .toString()
    .padStart(2, "0")}`;
}

/* ============================================================
   VU METER
   ============================================================ */

function startVU() {
  const bars = document.querySelectorAll(".vu-bar");

  bars.forEach(bar => bar.classList.add("live"));

  clearInterval(vuInt);

  vuInt = setInterval(() => {
    bars.forEach(bar => {
      bar.style.height =
        Math.floor(Math.random() * 19 + 3) + "px";
    });
  }, 110);
}

function stopVU() {
  clearInterval(vuInt);
  vuInt = null;

  document.querySelectorAll(".vu-bar").forEach(bar => {
    bar.classList.remove("live");
    bar.style.height = "3px";
  });
}

/* ============================================================
   AUDIO EVENTS
   ============================================================ */

audio.addEventListener("loadedmetadata", () => {
  document.getElementById("durTime").textContent =
    fmt(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;

  document.getElementById("progFill").style.width =
    `${(audio.currentTime / audio.duration) * 100}%`;

  document.getElementById("curTime").textContent =
    fmt(audio.currentTime);

  document.getElementById("durTime").textContent =
    fmt(audio.duration);
});

audio.addEventListener("play", () => {
  isPlaying = true;

  document.getElementById("ppIcon").className =
    "ti ti-player-pause";

  document.getElementById("onAir").classList.add("live");

  startVU();
  renderPlaylist();
});

audio.addEventListener("pause", () => {
  isPlaying = false;

  document.getElementById("ppIcon").className =
    "ti ti-player-play";

  document.getElementById("onAir").classList.remove("live");

  stopVU();
  renderPlaylist();
});

audio.addEventListener("ended", () => {

  if (repeatMode === "one") {
    audio.currentTime = 0;
    playAudio();
    return;
  }

  if (
    repeatMode === "all" ||
    shuffleOn ||
    curIdx < tracks.length - 1
  ) {
    nextTrack();
    return;
  }

  isPlaying = false;

  document.getElementById("ppIcon").className =
    "ti ti-player-play";

  document.getElementById("onAir").classList.remove("live");

  stopVU();
});

audio.addEventListener("error", () => {
  console.error(
    "Could not load:",
    tracks[curIdx]
  );

  document.getElementById("nowLabel").textContent =
    "TRACK COULD NOT BE LOADED";
});

/* ============================================================
   DELETE
   BUILT-IN TRACKS HAVE NO DELETE BUTTON.
   ============================================================ */

function removeTrack(idx, event) {
  event.stopPropagation();

  const track = tracks[idx];

  if (track.builtIn) {
    return;
  }

  if (track.url) {
    URL.revokeObjectURL(track.url);
  }

  const wasCurrent = idx === curIdx;

  tracks.splice(idx, 1);

  if (!tracks.length) {
    curIdx = -1;
    audio.pause();
    audio.src = "";

    document.getElementById("trackName").textContent =
      "No track loaded";

    document.getElementById("trackName")
      .classList.add("empty");

    document.getElementById("nowLabel").textContent =
      "— SELECT A TRACK";

    renderPlaylist();
    updateHint();
    return;
  }

  if (idx < curIdx) {
    curIdx--;
  }

  if (wasCurrent) {
    curIdx = Math.min(curIdx, tracks.length - 1);
    loadTrack(curIdx, false);
  }

  updateHint();
  renderPlaylist();
}

/* ============================================================
   PLAYLIST
   ============================================================ */

function renderPlaylist() {
  const playlist =
    document.getElementById("playlist");

  playlist.innerHTML = "";

  tracks.forEach((track, index) => {

    const item =
      document.createElement("div");

    item.className =
      "pl-item" +
      (index === curIdx ? " active" : "");

    const playing =
      index === curIdx && isPlaying;

    const deleteButton =
      track.builtIn
        ? ""
        : `
          <button
            class="pl-del"
            aria-label="Remove uploaded track"
            title="Remove uploaded track"
          >
            <i class="ti ti-x"></i>
          </button>
        `;

    item.innerHTML = `
      ${
        playing
          ? `
            <div class="pl-bars">
              <div class="pl-bar"></div>
              <div class="pl-bar"></div>
              <div class="pl-bar"></div>
            </div>
          `
          : `
            <span class="pl-num">
              ${index + 1}
            </span>
          `
      }

      <span class="pl-name">
        ${track.name.toUpperCase()}
      </span>

      ${
        track.builtIn
          ? `
            <span
              style="
                font-family:var(--mono);
                font-size:8px;
                color:var(--gold);
                letter-spacing:1px;
              "
            >
              STV
            </span>
          `
          : ""
      }

      ${deleteButton}
    `;

    item.addEventListener("click", () => {
      loadTrack(index, true);
    });

    const del =
      item.querySelector(".pl-del");

    if (del) {
      del.addEventListener("click", e => {
        removeTrack(index, e);
      });
    }

    playlist.appendChild(item);
  });
}

/* ============================================================
   INITIALIZE
   ============================================================ */

updateHint();
renderPlaylist();
loadTrack(0, false);
</script>
</body>

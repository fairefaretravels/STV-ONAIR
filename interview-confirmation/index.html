<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest & Interview Confirmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10;
  --panel:#15181C;
  --panel-edge:#232830;
  --text:#EDE7DC;
  --text-dim:#9AA0A8;
  --accent:#FF8A3D;
  --live:#5CE1B8;
  --field:#1C2025;
}
*{
  box-sizing:border-box;
}
html,
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{
  padding:32px 20px 60px;
  display:flex;
  justify-content:center;
}
.sheet{
  width:100%;
  max-width:640px;
  border:1px solid var(--panel-edge);
  background:var(--panel);
  border-radius:4px;
  overflow:hidden;
}
header{
  padding:28px;
  border-bottom:1px solid var(--panel-edge);
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--live);
  margin:0 0 8px;
}
h1{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.05;
  margin:0 0 8px;
  text-transform:uppercase;
}
h1 span{
  color:var(--accent);
}
.meta{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  line-height:1.6;
  color:var(--text-dim);
}
form{
  padding:24px 28px 28px;
}
fieldset{
  border:none;
  margin:0 0 24px;
  padding:0;
}
legend{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:800;
  font-size:18px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--accent);
  margin-bottom:14px;
  padding:0;
}
.row{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}
.row > div{
  flex:1;
}
.field{
  margin-bottom:12px;
}
label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:6px;
}
input,
select,
textarea{
  width:100%;
  background:var(--field);
  border:1px solid var(--panel-edge);
  border-radius:2px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:11px 12px;
}
input::placeholder,
textarea::placeholder{
  color:#666C74;
}
input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(255,138,61,.15);
}
textarea{
  resize:vertical;
  min-height:100px;
  line-height:1.5;
}
.submit{
  width:100%;
  background:var(--live);
  color:var(--bg);
  border:none;
  border-radius:2px;
  padding:14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
  transition:
    opacity .15s ease,
    transform .15s ease;
}
.submit:hover{
  opacity:.85;
}
.submit:active{
  transform:translateY(1px);
}
.footnote{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  line-height:1.6;
  color:var(--text-dim);
  text-align:center;
  margin-top:12px;
  letter-spacing:.04em;
}
@media(max-width:600px){
  body{
    padding:15px 12px 40px;
  }
  header{
    padding:24px 20px;
  }
  form{
    padding:22px 20px 24px;
  }
  .row{
    flex-direction:column;
    gap:0;
  }
}
</style>
</head>
<body>
<main class="sheet">
  <header>
    <p class="eyebrow">
      Guest & Interview Confirmation
    </p>
    <h1>
      GUEST <span>CONFIRMATION</span>
    </h1>
    <p class="meta">
      Complete the information below to confirm your appearance,
      interview, booking, or scheduled engagement.
    </p>
  </header>
  <form
    action="https://formsubmit.co/houseofmedia.marketing@gmail.com"
    method="POST"
  >
    <!-- FORM SETTINGS -->
    <input
      type="hidden"
      name="_subject"
      value="New Guest / Interview Confirmation"
    >
    <input
      type="hidden"
      name="_template"
      value="table"
    >
    <input
      type="hidden"
      name="_captcha"
      value="false"
    >
    <!-- GUEST INFORMATION -->
    <fieldset>
      <legend>Guest Information</legend>
      <div class="field">
        <label for="guest_name">
          Full Name
        </label>
        <input
          type="text"
          id="guest_name"
          name="Guest Name"
          placeholder="Enter your full name"
          required
        >
      </div>
      <div class="row">
        <div>
          <label for="email">
            Email
          </label>
          <input
            type="email"
            id="email"
            name="Email"
            placeholder="you@example.com"
            required
          >
        </div>
        <div>
          <label for="phone">
            Phone
          </label>
          <input
            type="tel"
            id="phone"
            name="Phone"
            placeholder="Phone number"
          >
        </div>
      </div>
      <div class="field">
        <label for="organization">
          Organization / Business / Brand
        </label>
        <input
          type="text"
          id="organization"
          name="Organization or Brand"
          placeholder="If applicable"
        >
      </div>
    </fieldset>
    <!-- APPEARANCE INFORMATION -->
    <fieldset>
      <legend>Appearance Details</legend>
      <div class="field">
        <label for="appearance_type">
          Type of Appearance
        </label>
        <select
          id="appearance_type"
          name="Appearance Type"
          required
        >
          <option value="">
            Select an option
          </option>
          <option value="Interview">
            Interview
          </option>
          <option value="Guest Appearance">
            Guest Appearance
          </option>
          <option value="Podcast">
            Podcast
          </option>
          <option value="Live Show">
            Live Show
          </option>
          <option value="Performance">
            Performance
          </option>
          <option value="Panel">
            Panel
          </option>
          <option value="Event">
            Event
          </option>
          <option value="Other">
            Other
          </option>
        </select>
      </div>
      <div class="field">
        <label for="program">
          Show / Program / Event
        </label>
        <input
          type="text"
          id="program"
          name="Show Program or Event"
          placeholder="Name of show, program, or event"
        >
      </div>
      <div class="row">
        <div>
          <label for="date">
            Date
          </label>
          <input
            type="date"
            id="date"
            name="Date"
            required
          >
        </div>
        <div>
          <label for="time">
            Time
          </label>
          <input
            type="time"
            id="time"
            name="Time"
            required
          >
        </div>
      </div>
      <div class="field">
        <label for="location">
          Location / Platform
        </label>
        <select
          id="location"
          name="Location or Platform"
        >
          <option value="">
            Select an option
          </option>
          <option value="Phone">
            Phone
          </option>
          <option value="Zoom">
            Zoom
          </option>
          <option value="Google Meet">
            Google Meet
          </option>
          <option value="Video Call">
            Video Call
          </option>
          <option value="In Person">
            In Person
          </option>
          <option value="Studio">
            Studio
          </option>
          <option value="Event Location">
            Event Location
          </option>
          <option value="Other">
            Other
          </option>
        </select>
      </div>
      <div class="field">
        <label for="link">
          Meeting Link / Address
        </label>
        <input
          type="text"
          id="link"
          name="Meeting Link or Address"
          placeholder="Enter link or location if applicable"
        >
      </div>
    </fieldset>
    <!-- CONTENT -->
    <fieldset>
      <legend>Content & Preparation</legend>
      <div class="field">
        <label for="topics">
          Topics / Discussion
        </label>
        <textarea
          id="topics"
          name="Topics"
          placeholder="Tell us what you'd like to discuss or highlight."
        ></textarea>
      </div>
      <div class="field">
        <label for="bio">
          Short Bio
        </label>
        <textarea
          id="bio"
          name="Short Bio"
          placeholder="Provide a short biography or introduction."
        ></textarea>
      </div>
      <div class="field">
        <label for="website">
          Website / Social Media
        </label>
        <input
          type="text"
          id="website"
          name="Website or Social Media"
          placeholder="Website or social media links"
        >
      </div>
      <div class="field">
        <label for="notes">
          Additional Notes
        </label>
        <textarea
          id="notes"
          name="Additional Notes"
          placeholder="Anything else the production or booking team should know?"
        ></textarea>
      </div>
    </fieldset>
    <!-- CONFIRMATION -->
    <fieldset>
      <legend>Confirmation</legend>
      <div class="field">
        <label for="confirmation">
          Confirmation Status
        </label>
        <select
          id="confirmation"
          name="Confirmation Status"
          required
        >
          <option value="">
            Select an option
          </option>
          <option value="Confirmed">
            I confirm my appearance
          </option>
          <option value="Need to Reschedule">
            I need to reschedule
          </option>
          <option value="Need More Information">
            I need more information
          </option>
        </select>
      </div>
      <div class="field">
        <label for="additional">
          Message
        </label>
        <textarea
          id="additional"
          name="Message"
          placeholder="Add any final questions or information."
        ></textarea>
      </div>
    </fieldset>
    <button
      type="submit"
      class="submit"
    >
      Submit Confirmation
    </button>
    <p class="footnote">
      Your information will be sent to the booking team for review.
    </p>
  </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STV CHANNEL 3 — Coming Soon</title>
  <style>
    :root {
      --gold: #d8b25a;
      --gold-light: #f3d889;
      --bg: #04070d;
      --bg2: #0b1220;
      --text: #ffffff;
      --muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(216,178,90,.16), transparent 35%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("../stv-gif.gif") center/cover no-repeat;
      filter: blur(25px) brightness(.18);
      transform: scale(1.15);
      z-index: -2;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(4,7,13,.82);
      z-index: -1;
    }
    .page {
      width: min(900px, 92%);
      text-align: center;
      padding: 70px 30px;
    }
    .logo {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 30px;
      box-shadow: 0 0 40px rgba(216,178,90,.25);
    }
    .eyebrow {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(216,178,90,.5);
      border-radius: 50px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }
    .channel-number {
      font-size: clamp(90px, 18vw, 190px);
      line-height: .8;
      font-weight: 900;
      color: rgba(255,255,255,.06);
      letter-spacing: -8px;
      margin-bottom: -10px;
    }
    h1 {
      font-size: clamp(48px, 9vw, 100px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    h1 span {
      color: var(--gold);
    }
    .divider {
      width: 90px;
      height: 3px;
      margin: 35px auto;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }
    .message {
      max-width: 650px;
      margin: 0 auto;
      color: #d1d5db;
      font-size: clamp(17px, 2.5vw, 22px);
      line-height: 1.7;
    }
    .status {
      margin: 40px auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 22px;
      border-radius: 50px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      color: var(--gold-light);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 13px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 15px var(--gold-light);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      50% {
        opacity: .35;
        transform: scale(.7);
      }
    }
    .back-button {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
      color: #050505;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: .3s;
    }
    .back-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 35px rgba(216,178,90,.35);
    }
    .footer {
      margin-top: 55px;
      color: #6b7280;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @media (max-width: 600px) {
      .page {
        padding: 50px 20px;
      }
      .logo {
        width: 65px;
        height: 65px;
      }
      .channel-number {
        letter-spacing: -5px;
      }
      h1 {
        letter-spacing: -2px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="logo"
      src="../stvlogo1.jpg"
      alt="Saneca TV"
    >
    <div class="eyebrow">
      STV Broadcast Network
    </div>
    <div class="channel-number">
      06
    </div>
    <h1>
      Channel <span>6</span>
    </h1>
    <div class="divider"></div>
    <p class="message">
      Something new is being built for STV Channel 6.
      Programming, original content, and more are coming soon.
      Check back as we continue expanding the STV network.
    </p>
    <div class="status">
      <span class="dot"></span>
      Coming Soon
    </div>
    <br>
    <a class="back-button" href="/watch">
      ← Back to STV
    </a>
    <div class="footer">
      Saneca TV · STV Broadcast Network
    </div>
  </main>
</body>
</html>
